# Acclaim explorer server settings (retrieval, generation).
# Run the server with:
#   uvicorn acclaim_explorer.server.main:app --port 8000 --reload

retriever:
  default: bm25
  top_k: 5

  bm25:
    # Option A — prebuilt MSMARCO passage index (downloads ~1.7 GB to ~/.cache/pyserini/ on first use).
    # Requires Java 11+: https://www.java.com/en/download/
    prebuilt_index: msmarco-v1-passage

    # Option B — local index built from a custom corpus subset (faster startup, smaller footprint).
    # Build with: micromamba run -n attribution-eval python -m acclaim_explorer.server.build_index
    # index_path: ./data/bm25_index

generator:
  model: "openrouter/google/gemma-4-31b-it"
  api_key: ${OPENROUTER_API_KEY}
  temperature: 0.7
  max_tokens: 800
  system_prompt: |
    You are a helpful assistant that answers questions based on the provided documents.
    Always cite your sources inline using [N] notation immediately after the relevant statement
    (e.g. "Paris is the capital of France [1].").
    Cite at least one document per factual claim. Only cite documents from the list provided.
    If the documents don't contain enough information to fully answer the question, say so clearly.
    Make sure to answer the question in a few informative sentences, not just a list of facts.
